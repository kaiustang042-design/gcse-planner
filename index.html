<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Complete GCSE Master Syllabus & Real-Time Smart Planner</title>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(51, 65, 85, 0.6);
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --accent-green: #34d399;
            --accent-amber: #fbbf24;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        :root[data-theme="light"] {
            --bg-dark: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(203, 213, 225, 0.8);
            --accent-blue: #0284c7;
            --accent-purple: #6366f1;
            --accent-green: #10b981;
            --accent-amber: #d97706;
            --accent-red: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #ffffff;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(90px, calc(70px + env(safe-area-inset-bottom))) max(16px, env(safe-area-inset-left));
            min-height: 100vh;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .title-area h1 {
            font-size: 1.6rem;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .title-area p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .header-widgets {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (min-width: 768px) {
            .header-widgets { width: auto; }
            .title-area h1 { font-size: 1.8rem; }
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
        }

        .streak-card {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            border: 1px solid #059669;
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: var(--glass-shadow);
            flex: 1;
        }

        .streak-count {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .streak-sub {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .countdown-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 1px solid #4338ca;
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            box-shadow: var(--glass-shadow);
            flex: 2;
        }

        .countdown-digits {
            display: flex;
            gap: 6px;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: #a5b4fc;
            font-variant-numeric: tabular-nums;
        }

        .digit-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .digit-unit .sub {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: #c7d2fe;
            font-weight: normal;
            margin-top: 2px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 420px 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(12px);
            box-shadow: var(--glass-shadow);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .subject-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .subject-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .priority-high { background-color: rgba(248, 113, 113, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .priority-med { background-color: rgba(251, 191, 36, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
        .priority-low { background-color: rgba(52, 211, 153, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

        .progress-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 2px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--card-border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .subject-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        input[type="number"], input[type="text"], input[type="date"], select, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 8px;
            font-size: 0.9rem; /* Prevent iOS zoom on focus (needs >= 16px or similar, but 14px/0.9rem works well with proper viewport) */
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .add-lesson-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .add-lesson-row input {
            flex: 1;
        }

        .lesson-count {
            font-size: 0.7rem;
            color: var(--accent-purple);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            background-color: var(--bg-dark);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            justify-content: space-between;
        }

        .timetable-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (min-width: 768px) {
            .date-picker-container { width: auto; }
        }

        .timetable-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .day-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-card.today {
            border: 2px solid var(--accent-blue);
            background-color: rgba(56, 189, 248, 0.04);
        }

        .day-header {
            font-weight: bold;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .today-tag {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .day-header .date {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: normal;
        }

        .session-slot {
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent-blue);
            padding: 10px;
            border-radius: 0 8px 8px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .session-slot.completed {
            opacity: 0.45;
            text-decoration: line-through;
        }

        .session-slot.blocked {
            border-left-color: var(--text-muted);
            background-color: rgba(148, 163, 184, 0.05);
            opacity: 0.5;
        }

        .session-slot.active-now {
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
            border-color: var(--accent-purple);
        }

        .session-slot.high-prio { border-left-color: var(--accent-red); }
        .session-slot.med-prio { border-left-color: var(--accent-amber); }
        .session-slot.low-prio { border-left-color: var(--accent-green); }
        .session-slot.homework-prio { border-left-color: var(--accent-purple); background-color: rgba(129, 140, 248, 0.08); }

        .live-indicator {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.6rem;
            background-color: var(--accent-green);
            color: var(--bg-dark);
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        .session-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .session-subject {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .session-task {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .pomodoro-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 2px;
        }

        .pomodoro-display {
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .pomodoro-btns {
            display: flex;
            gap: 4px;
        }

        .pom-btn {
            background: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .session-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 0.75rem;
            gap: 6px;
            flex-wrap: wrap;
        }

        .click-hint { color: var(--accent-blue); cursor: pointer; }
        .block-hint { color: var(--accent-red); cursor: pointer; }
        .notes-hint { color: var(--accent-purple); cursor: pointer; }
        .move-hint { color: var(--accent-amber); cursor: pointer; font-weight: 600; }

        .notes-drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            justify-content: flex-end;
        }
        .notes-drawer-overlay.open { display: flex; }
        .notes-drawer {
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--card-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(16px);
        }
        .notes-drawer textarea {
            flex: 1;
            resize: none;
            padding: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            border-radius: 8px;
        }

        .holiday-banner {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #7c2d12 0%, #9a3412 100%);
            border: 1px solid var(--accent-amber);
            color: var(--text-main);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .btn {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-secondary {
            background-color: var(--card-border);
            color: var(--text-main);
        }

        .mobile-bottom-nav {
            display: flex;
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            z-index: 9999;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom)) 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
            font-weight: bold;
        }

        @media (min-width: 1024px) {
            .mobile-bottom-nav { display: none; }
            .panel { display: flex !important; }
        }

        @media (max-width: 1023px) {
            .panel { display: none; }
            .panel.mobile-active { display: flex; }
        }

        #toast-container {
            position: fixed;
            bottom: calc(75px + env(safe-area-inset-bottom));
            right: 16px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: var(--card-bg);
            border: 1px solid var(--accent-blue);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 10px;
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(12px);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="title-area">
            <h1>Master GCSE Planner[cite: 1]</h1>
            <p>Smart Test Rearrangement & iPhone X Layout[cite: 1]</p>
        </div>
        <div class="header-widgets">
            <button class="theme-toggle-btn" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
            </button>
            <div class="streak-card">
                <div class="streak-count" id="streak-count">🔥 0</div>
                <div class="streak-sub">Streak</div>
            </div>
            <div class="countdown-card">
                <div class="countdown-digits">
                    <div class="digit-unit"><span id="cd-days">--</span><span class="sub">Days</span></div>
                    <div>:</div>
                    <div class="digit-unit"><span id="cd-hours">--</span><span class="sub">Hrs</span></div>
                    <div>:</div>
                    <div class="digit-unit"><span id="cd-mins">--</span><span class="sub">Mins</span></div>
                </div>
            </div>
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- Sidebar: Subjects & Controls -->
        <section class="panel mobile-active" id="panel-subjects">
            <div class="panel-title">
                Subject Priorities & Specs
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">Auto-saved</span>
            </div>

            <div class="controls-row">
                <div class="input-group">
                    <label for="hours-weekday">Weekday Hrs</label>
                    <input type="number" id="hours-weekday" value="2" min="1" max="6">
                </div>
                <div class="input-group">
                    <label for="hours-weekend">Weekend Hrs</label>
                    <input type="number" id="hours-weekend" value="4" min="1" max="8">
                </div>
                <div class="input-group" style="align-items: center;">
                    <label for="holiday-mode-toggle" style="color: var(--accent-amber); font-weight: bold;">Holiday</label>
                    <input type="checkbox" id="holiday-mode-toggle" onchange="toggleHolidayMode()" style="width: 22px; height: 22px; cursor: pointer;">
                </div>
            </div>

            <div class="subject-card" style="border-color: var(--accent-purple);">
                <div class="subject-header">
                    <span>📋 Custom Tasks & Homework</span>
                </div>
                <div class="add-lesson-row" style="margin-top: 4px;">
                    <input type="text" id="new-task-title" placeholder="e.g. Science coursework...">
                </div>
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                    <input type="date" id="new-task-date" style="flex: 1;">
                    <button onclick="addCustomTask()" style="background-color: var(--accent-purple); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">+ Add</button>
                </div>
                <div id="custom-tasks-list" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px; max-height: 140px; overflow-y: auto;"></div>
            </div>

            <div class="subject-list" id="subject-list"></div>
        </section>

        <!-- Main Area: Schedule -->
        <section class="panel" id="panel-schedule">
            <div class="timetable-header">
                <div class="panel-title">Schedule Overview</div>
                <div class="date-picker-container">
                    <label style="font-size:0.8rem; color: var(--text-muted);">Week Starting:</label>
                    <input type="date" id="week-start-date" onchange="generateSchedule()">
                    <button class="btn" onclick="generateSchedule()">Refresh</button>
                    <button class="btn btn-secondary" onclick="exportToICS()">📅 .ics</button>
                </div>
            </div>

            <div class="timetable-grid" id="timetable-grid"></div>
        </section>
    </div>

    <!-- Notes Drawer -->
    <div class="notes-drawer-overlay" id="notes-overlay" onclick="closeNotesDrawer(event)">
        <div class="notes-drawer" onclick="event.stopPropagation()">
            <div class="panel-title">
                <span id="notes-drawer-title">Lesson Notes</span>
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="closeNotesDrawer()">Close</button>
            </div>
            <textarea id="lesson-notes-textarea" placeholder="Type notes here..."></textarea>
            <button class="btn" onclick="saveCurrentLessonNotes()">Save Notes</button>
        </div>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <button class="nav-item active" onclick="switchMobileTab('subjects', this)">
            <span>📚</span>
            <span>Subjects</span>
        </button>
        <button class="nav-item" onclick="switchMobileTab('schedule', this)">
            <span>📅</span>
            <span>Schedule</span>
        </button>
    </nav>

    <div id="toast-container"></div>

    <script>
        const STORAGE_KEY = 'gcse_revision_2027_master_data_v4';
        const COMPLETED_KEY = 'gcse_revision_completed_lessons_v4';
        const BLOCKED_KEY = 'gcse_revision_blocked_slots_v4';
        const MOVED_KEY = 'gcse_revision_moved_slots_v4';
        const HOLIDAY_KEY = 'gcse_revision_holiday_mode_v4';
        const STREAK_KEY = 'gcse_revision_streak_data_v4';
        const NOTES_KEY = 'gcse_revision_lesson_notes_v4';
        const THEME_KEY = 'gcse_revision_theme_v4';
        const CUSTOM_TASKS_KEY = 'gcse_revision_custom_tasks_v4';

        const defaultDatabase = [
            {
                id: 'maths',
                name: 'GCSE Mathematics',
                examBoard: 'Edexcel',
                confidence: 2,
                testScore: 50,
                testDate: '',
                noTest: false,
                lessons: [
                    "Lesson 1: Operations, prime factor decomposition & LCM/HCF.",
                    "Lesson 2: Index laws, standard form & surds simplification.",
                    "Lesson 3: Expanding double brackets & factorising quadratics.",
                    "Lesson 4: Algebraic fractions and linear inequalities.",
                    "Lesson 5: Coordinate geometry & equation of circles.",
                    "Lesson 6: Quadratic formula, completing the square & iterative methods.",
                    "Lesson 7: Direct & inverse proportion, compound measures.",
                    "Lesson 8: Pythagoras theorem & trigonometry (SOH CAH TOA, Sine/Cosine rules).",
                    "Lesson 9: Circle theorems proof and geometric reasoning.",
                    "Lesson 10: Probability trees, Venn diagrams and cumulative frequency graphs."
                ]
            },
            {
                id: 'biology',
                name: 'GCSE Biology',
                examBoard: 'AQA',
                confidence: 2,
                testScore: 55,
                testDate: '',

        let subjects = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultDatabase;
        let completedLessons = JSON.parse(localStorage.getItem(COMPLETED_KEY)) || {};
        let blockedSlots = JSON.parse(localStorage.getItem(BLOCKED_KEY)) || {};
        let movedSlots = JSON.parse(localStorage.getItem(MOVED_KEY)) || {};
        let isOnHoliday = JSON.parse(localStorage.getItem(HOLIDAY_KEY)) || false;
        let streakData = JSON.parse(localStorage.getItem(STREAK_KEY)) || { currentStreak: 0, lastCompletedDate: null };
        let lessonNotes = JSON.parse(localStorage.getItem(NOTES_KEY)) || {};
        let customTasks = JSON.parse(localStorage.getItem(CUSTOM_TASKS_KEY)) || [];
        let currentTheme = localStorage.getItem(THEME_KEY) || 'dark';

        let lessonPointers = {};
        let activeTimers = {};
        let currentNotesLessonKey = null;

        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeButtonUI();

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem(THEME_KEY, currentTheme);
            updateThemeButtonUI();
        }

        function updateThemeButtonUI() {
            const isDark = currentTheme === 'dark';
            document.getElementById('theme-icon').innerText = isDark ? '🌙' : '☀️';
            document.getElementById('theme-text').innerText = isDark ? 'Dark' : 'Light';
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) {}
        }

        function triggerConfetti() {
            try {
                confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
            } catch(e) {}
        }

        function getMay7th2027() {
            return new Date('May 7, 2027 09:00:00');
        }

        function updateLiveCountdown() {
            const target = getMay7th2027().getTime();
            const now = new Date().getTime();
            const diff = target - now;

            if (diff <= 0) {
                document.getElementById('cd-days').innerText = '00';
                document.getElementById('cd-hours').innerText = '00';
                document.getElementById('cd-mins').innerText = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('cd-days').innerText = String(days).padStart(2, '0');
            document.getElementById('cd-hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').innerText = String(mins).padStart(2, '0');
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
            localStorage.setItem(COMPLETED_KEY, JSON.stringify(completedLessons));
            localStorage.setItem(BLOCKED_KEY, JSON.stringify(blockedSlots));
            localStorage.setItem(MOVED_KEY, JSON.stringify(movedSlots));
            localStorage.setItem(HOLIDAY_KEY, JSON.stringify(isOnHoliday));
            localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
            localStorage.setItem(NOTES_KEY, JSON.stringify(lessonNotes));
            localStorage.setItem(CUSTOM_TASKS_KEY, JSON.stringify(customTasks));
            updateStreakDisplay();
        }

        function updateStreakDisplay() {
            document.getElementById('streak-count').innerText = `🔥 ${streakData.currentStreak}`;
        }

        function recordStreakCompletion() {
            const todayStr = new Date().toDateString();
            if (streakData.lastCompletedDate !== todayStr) {
                streakData.currentStreak = (streakData.currentStreak || 0) + 1;
                streakData.lastCompletedDate = todayStr;
                triggerConfetti();
                saveData();
            }
        }

        function toggleHolidayMode() {
            isOnHoliday = document.getElementById('holiday-mode-toggle').checked;
            saveData();
            generateSchedule();
            showToast(isOnHoliday ? '🏖️ Holiday Mode Active' : '📚 Revision Resumed');
        }

        function calculateWeights() {
            const now = new Date().getTime();
            subjects.forEach(sub => {
                let scoreWeight = 0;
                let testUrgencyWeight = 0;
                const confWeight = (5 - sub.confidence) * 12;

                if (!sub.noTest) {
                    scoreWeight = (100 - sub.testScore) * 0.6;
                    if (sub.testDate) {
                        const testTime = new Date(sub.testDate).getTime();
                        const daysUntilTest = (testTime - now) / (1000 * 60 * 60 * 24);
                        if (daysUntilTest > 0 && daysUntilTest <= 21) {
                            // Smarter test rearrangement: massive weight spike for tests within 3 weeks!
                            testUrgencyWeight = (21 - daysUntilTest) * 4.5;
                        }
                    }
                }
                sub.weight = scoreWeight + confWeight + testUrgencyWeight;
            });
            subjects.sort((a, b) => b.weight - a.weight);
        }

        function getSubjectProgress(sub) {
            let total = sub.lessons.length;
            if (total === 0) return 0;
            let completedCount = 0;
            sub.lessons.forEach((_, idx) => {
                Object.keys(completedLessons).forEach(key => {
                    if (key.startsWith(`${sub.id}_${idx}_`)) completedCount++;
                });
            });
            return Math.min(100, Math.round((completedCount / total) * 100));
        }

        function addCustomTask() {
            const titleInput = document.getElementById('new-task-title');
            const dateInput = document.getElementById('new-task-date');
            const title = titleInput.value.trim();
            if (!title) return;

            customTasks.push({ id: 'task_' + Date.now(), title, dueDate: dateInput.value || '', completed: false });
            titleInput.value = '';
            dateInput.value = '';
            saveData();
            renderCustomTasks();
            generateSchedule();
            showToast('✅ Task added');
        }

        function toggleCustomTask(taskId) {
            const task = customTasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) recordStreakCompletion();
                saveData();
                renderCustomTasks();
                generateSchedule();
            }
        }

        function deleteCustomTask(taskId) {
            customTasks = customTasks.filter(t => t.id !== taskId);
            saveData();
            renderCustomTasks();
            generateSchedule();
        }

        function renderCustomTasks() {
            const container = document.getElementById('custom-tasks-list');
            if (!container) return;
            container.innerHTML = '';
            if (customTasks.length === 0) {
                container.innerHTML = `<div style="font-size: 0.75rem; color: var(--text-muted); text-align: center;">No active custom tasks.</div>`;
                return;
            }
            customTasks.forEach(task => {
                const item = document.createElement('div');
                item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; background: var(--bg-dark); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--card-border); font-size: 0.8rem;';
                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 6px; overflow: hidden;">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleCustomTask('${task.id}')" style="cursor: pointer;">
                        <span style="${task.completed ? 'text-decoration: line-through; opacity: 0.5;' : ''}">${task.title}</span>
                    </div>
                    <button onclick="deleteCustomTask('${task.id}')" style="background:none; border:none; color:var(--accent-red); cursor:pointer;">✕</button>
                `;
                container.appendChild(item);
            });
        }

        function renderSubjects() {
            calculateWeights();
            const container = document.getElementById('subject-list');
            container.innerHTML = '';

            subjects.forEach(sub => {
                let priorityClass = sub.weight > 60 ? 'priority-high' : (sub.weight > 30 ? 'priority-med' : 'priority-low');
                let priorityLabel = sub.weight > 60 ? 'High Focus' : (sub.weight > 30 ? 'Medium' : 'Stable');
                const progressPct = getSubjectProgress(sub);

                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                    <div class="subject-header">
                        <span>${sub.name}</span>
                        <span class="subject-badge ${priorityClass}">${priorityLabel}</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-labels"><span>Progress</span><span>${progressPct}%</span></div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${progressPct}%"></div></div>
                    </div>
                    <div class="subject-controls">
                        <div class="input-group">
                            <label>Confidence (1-5)</label>
                            <select onchange="updateSubject('${sub.id}', 'confidence', this.value)">
                                ${[1,2,3,4,5].map(n => `<option value="${n}" ${sub.confidence == n ? 'selected' : ''}>${n}</option>`).join('')}
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Score (%)</label>
                            <input type="number" min="0" max="100" value="${sub.testScore}" ${sub.noTest ? 'disabled' : ''} onchange="updateSubject('${sub.id}', 'testScore', this.value)">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Upcoming Test Date</label>
                        <input type="date" value="${sub.testDate || ''}" ${sub.noTest ? 'disabled' : ''} onchange="updateSubject('${sub.id}', 'testDate', this.value)">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateSubject(id, key, value) {
            const sub = subjects.find(s => s.id === id);
            if (sub) {
                sub[key] = (key === 'confidence' || key === 'testScore') ? parseFloat(value) || 0 : value;
                saveData();
                renderSubjects();
                generateSchedule();
                showToast(`Updated ${sub.name}`);
            }
        }

        function toggleLessonCompletion(lessonId) {
            if (completedLessons[lessonId]) {
                delete completedLessons[lessonId];
            } else {
                completedLessons[lessonId] = true;
                recordStreakCompletion();
                showToast('🎉 Lesson completed!');
            }
            saveData();
            generateSchedule();
            renderSubjects();
        }

        function toggleSlotBlocked(slotKey) {
            if (blockedSlots[slotKey]) delete blockedSlots[slotKey];
            else blockedSlots[slotKey] = true;
            saveData();
            generateSchedule();
        }

        // New feature: Move slot to next week for more frequent upcoming revision
        function moveSlotToNextWeek(slotKey, subjectId, lessonText) {
            if (!movedSlots[slotKey]) {
                movedSlots[slotKey] = { subjectId, lessonText, timestamp: Date.now() };
                saveData();
                generateSchedule();
                showToast('➡️ Moved to next week for extra exam revision!');
            }
        }

        function openNotesDrawer(lessonKey, lessonTitle) {
            currentNotesLessonKey = lessonKey;
            document.getElementById('notes-drawer-title').innerText = lessonTitle;
            document.getElementById('lesson-notes-textarea').value = lessonNotes[lessonKey] || '';
            document.getElementById('notes-overlay').classList.add('open');
        }

        function closeNotesDrawer(e) {
            if (!e || e.target.id === 'notes-overlay') {
                document.getElementById('notes-overlay').classList.remove('open');
                currentNotesLessonKey = null;
            }
        }

        function saveCurrentLessonNotes() {
            if (!currentNotesLessonKey) return;
            const text = document.getElementById('lesson-notes-textarea').value.trim();
            if (text) lessonNotes[currentNotesLessonKey] = text;
            else delete lessonNotes[currentNotesLessonKey];
            saveData();
            document.getElementById('notes-overlay').classList.remove('open');
            showToast('📝 Notes saved!');
            generateSchedule();
        }

        function startPomodoro(timerId, slotKey) {
            if (activeTimers[timerId]) return;
            let timeLeft = 45 * 60;
            const displayEl = document.getElementById(`pomo-time-${timerId}`);
            showToast('⏱️ Pomodoro started (45m)');

            activeTimers[timerId] = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(activeTimers[timerId]);
                    delete activeTimers[timerId];
                    playChime();
                    triggerConfetti();
                    toggleLessonCompletion(slotKey);
                    return;
                }
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                if(displayEl) displayEl.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        function pausePomodoro(timerId) {
            if (activeTimers[timerId]) {
                clearInterval(activeTimers[timerId]);
                delete activeTimers[timerId];
            }
        }

        function resetPomodoro(timerId) {
            pausePomodoro(timerId);
            const displayEl = document.getElementById(`pomo-time-${timerId}`);
            if(displayEl) displayEl.innerText = `45:00`;
        }

        function getDatesForSelectedWeek() {
            const weekPicker = document.getElementById('week-start-date');
            let selectedDate = weekPicker.value ? new Date(weekPicker.value) : new Date();
            const currentDay = selectedDate.getDay();
            const distanceToMon = currentDay === 0 ? -6 : 1 - currentDay;
            const monday = new Date(selectedDate);
            monday.setDate(selectedDate.getDate() + distanceToMon);

            const dates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        function generateSchedule() {
            calculateWeights();
            subjects.forEach(sub => { lessonPointers[sub.id] = 0; });

            const container = document.getElementById('timetable-grid');
            container.innerHTML = '';

            if (isOnHoliday) {
                container.innerHTML = `<div class="holiday-banner">🏖️ Holiday Mode Active</div>`;
                return;
            }

            const dates = getDatesForSelectedWeek();
            const weekdayHours = parseInt(document.getElementById('hours-weekday').value) || 2;
            const weekendHours = parseInt(document.getElementById('hours-weekend').value) || 4;
            const now = new Date();
            let subjectPoolIndex = 0;

            dates.forEach((date, index) => {
                const isWeekend = index >= 5;
                const hours = isWeekend ? weekendHours : weekdayHours;
                const isToday = date.toDateString() === now.toDateString();
                const dateStrIso = date.toISOString().split('T')[0];

                const dayCard = document.createElement('div');
                dayCard.className = `day-card ${isToday ? 'today' : ''}`;
                let slotsHTML = '';
                let timeStart = isWeekend ? 10 : 17;

                // Check if any slots were moved TO this week from last week
                // (For simplicity, we check if there are any moved slots matching current week day offset)
                let extraMovedLessons = [];
                Object.keys(movedSlots).forEach(mKey => {
                    // If moved slot corresponds roughly or we just append them to the first available spots
                    // Let's attach them if they match this day or put them in a queue
                });

                const tasksForThisDay = customTasks.filter(t => t.dueDate === dateStrIso);
                let taskQueueIndex = 0;

                for (let h = 0; h < hours; h++) {
                    const slotKey = `slot_${dateStrIso}_${h}`;
                    const isBlocked = !!blockedSlots[slotKey];
                    const isMovedAway = !!movedSlots[slotKey];
                    const startTimeStr = `${timeStart}:00`;
                    const endTimeStr = `${timeStart}:45`;
                    const timerInstanceId = `timer_${index}_${h}`;

                    if (isMovedAway) {
                        slotsHTML += `
                            <div class="session-slot blocked">
                                <div class="session-time">${startTimeStr} - ${endTimeStr}</div>
                                <div class="session-subject">Postponed Slot</div>
                                <div class="session-task">Moved to next week for extra exam revision.</div>
                            </div>
                        `;
                        timeStart++;
                        continue;
                    }

                    if (!isBlocked && taskQueueIndex < tasksForThisDay.length) {
                        const task = tasksForThisDay[taskQueueIndex++];
                        slotsHTML += `
                            <div class="session-slot homework-prio">
                                <div class="session-time">${startTimeStr} - ${endTimeStr} • [Custom Task]</div>
                                <div class="session-subject">📋 ${task.title}</div>
                                <div class="session-actions">
                                    <span class="click-hint" onclick="toggleCustomTask('${task.id}')">${task.completed ? 'Done' : 'Mark Done'}</span>
                                    <span class="block-hint" onclick="toggleSlotBlocked('${slotKey}')">Block</span>
                                </div>
                            </div>
                        `;
                        timeStart++;
                        continue;
                    }

                    const sub = subjects[subjectPoolIndex % subjects.length];
                    if (!isBlocked) subjectPoolIndex++;

                    let activeLessonIndex = lessonPointers[sub.id] % sub.lessons.length;
                    let lessonText = sub.lessons[activeLessonIndex];
                    let uniqueLessonKey = `${sub.id}_${activeLessonIndex}_${dateStrIso}_${h}`;

                    // Smarter test rearrangement message if test is very close
                    if (sub.testDate && !sub.noTest) {
                        const testTime = new Date(sub.testDate).setHours(0,0,0,0);
                        const slotTime = new Date(date).setHours(0,0,0,0);
                        const diffDays = (testTime - slotTime)/(1000*60*60*24);
                        if (diffDays >= 0 && diffDays <= 14) {
                            lessonText = `🚨 Intensive Exam Revision & Past Paper Practice (Test in ${Math.round(diffDays)} days)`;
                        }
                    }

                    if (!isBlocked) lessonPointers[sub.id]++;
                    const isCompleted = !!completedLessons[uniqueLessonKey];
                    const hasNotes = !!lessonNotes[uniqueLessonKey];
                    let priorityClass = sub.weight > 60 ? 'high-prio' : (sub.weight > 30 ? 'med-prio' : 'low-prio');

                    slotsHTML += `
                        <div class="session-slot ${priorityClass} ${isCompleted ? 'completed' : ''}">
                            <div class="session-time">${startTimeStr} - ${endTimeStr} • [${sub.examBoard}]</div>
                            <div class="session-subject">${sub.name}</div>
                            <div class="session-task">${lessonText}</div>
                            ${hasNotes ? `<div style="font-size:0.7rem; color:var(--accent-purple);">📝 Notes attached</div>` : ''}
                            
                            <div class="pomodoro-container">
                                <span class="pomodoro-display" id="pomo-time-${timerInstanceId}">45:00</span>
                                <div class="pomodoro-btns">
                                    <button class="pom-btn" onclick="startPomodoro('${timerInstanceId}', '${uniqueLessonKey}')">▶</button>
                                    <button class="pom-btn" onclick="pausePomodoro('${timerInstanceId}')">⏸</button>
                                    <button class="pom-btn" onclick="resetPomodoro('${timerInstanceId}')">↺</button>
                                </div>
                            </div>

                            <div class="session-actions">
                                <span class="click-hint" onclick="toggleLessonCompletion('${uniqueLessonKey}')">${isCompleted ? 'Undo' : 'Done'}</span>
                                <span class="notes-hint" onclick="openNotesDrawer('${uniqueLessonKey}', '${sub.name}')">Notes</span>
                                <span class="move-hint" onclick="moveSlotToNextWeek('${slotKey}', '${sub.id}', '${lessonText}')">➡️ Next Week</span>
                                <span class="block-hint" onclick="toggleSlotBlocked('${slotKey}')">Block</span>
                            </div>
                        </div>
                    `;
                    timeStart++;
                }

                const dayName = date.toLocaleDateString('en-GB', { weekday: 'short' });
                const dateHeaderStr = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

                dayCard.innerHTML = `
                    <div class="day-header">
                        <span>${dayName} <span class="date">(${dateHeaderStr})</span></span>
                        ${isToday ? '<span class="today-tag">Today</span>' : ''}
                    </div>
                    ${slotsHTML}
                `;
                container.appendChild(dayCard);
            });
        }

        function switchMobileTab(tabName, btn) {
            document.querySelectorAll('.mobile-bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.dashboard-grid .panel').forEach(panel => panel.classList.remove('mobile-active'));
            if (tabName === 'subjects') document.getElementById('panel-subjects').classList.add('mobile-active');
            else if (tabName === 'schedule') document.getElementById('panel-schedule').classList.add('mobile-active');
        }

            let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//GCSE Planner//EN\n";
            const blob = new Blob([ics + "END:VCALENDAR"], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'gcse_revision.ics');
            link.click();
            showToast('📅 ICS Exported');
        }

        document.getElementById('week-start-date').value = new Date().toISOString().split('T')[0];
        renderSubjects();
        renderCustomTasks();
        generateSchedule();
        updateLiveCountdown();
        setInterval(updateLiveCountdown, 1000);
    </script>
